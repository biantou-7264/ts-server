<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1a1e2c;
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        .game-container {
            background: #2b3040;
            padding: 0;
            border-radius: 15px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.7), inset 0 2px 5px rgba(255, 255, 255, 0.1);
            border: 1px solid #4b5166;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }

        .title {
            font-size: 2.4rem;
            font-weight: 800;
            color: #f2d06b;
            letter-spacing: 2px;
            margin-left: 0.8rem;
        }

        .score-box {
            background: #1e2230;
            padding: 0.1rem 2rem;
            border-radius: 10px;
            color: #f2e8d5;
            font-weight: bold;
            text-align: center;
        }

        .score-label {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #b9b9d4;
        }

        .score-value {
            font-size: 2rem;
            line-height: 1.2;
            color: #f5d742;
            text-shadow: 0 0 8px rgba(245, 215, 66, 0.5);
        }

        .grid-wrapper {
            background: #181c28;
            padding: 0;
            border-radius: 10px;
            display: inline-block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            grid-template-rows: repeat(16, 1fr);
            gap: 5px;
            width: min(75vw, 75vh, 720px);
            height: min(75vw, 75vh, 720px);
            background: #0d0f16;
            padding: 5px;
            border-radius: 1.2rem;
        }

        .cell {
            background: #262c3a;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 0.9rem;
            color: #141824;
            transition: all 0.12s ease;
            box-shadow: 0 3px 0 #0e111a, 0 4px 8px rgba(0, 0, 0, 0.6);
            aspect-ratio: 1 / 1;
            padding: 0 2px;
            line-height: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 数值颜色映射 — 从2到65536+ */
        .cell[data-value="2"] {
            background: #ffc800;
            color: #323232;
        }

        .cell[data-value="4"] {
            background: #ff6433;
            color: #323232;
        }

        .cell[data-value="8"] {
            background: #32ff64;
            color: #323232;
        }

        .cell[data-value="16"] {
            background: #ff0032;
            color: #ffffff;
        }

        .cell[data-value="32"] {
            background: #3232ff;
            color: #1a1e2c;
        }

        .cell[data-value="64"] {
            background: #c800ff;
            color: #121524;
        }

        .cell[data-value="128"] {
            background: #ffff64;
            color: #1e1a0e;
        }

        .cell[data-value="256"] {
            background: #ff7f7f;
            color: #221a04;
        }

        .cell[data-value="512"] {
            background: #afff9f;
            color: #221a04;
        }

        .cell[data-value="1024"] {
            background: #c800c8;
            color: #1e1405;
        }

        .cell[data-value="2048"] {
            background: #ffc800;
            color: #1a0e00;
        }

        .cell[data-value="4096"] {
            background: #e5520c;
            color: #ffffff;
        }

        .cell[data-value="8192"] {
            background: #d63b0c;
            color: #ffffff;
        }

        .cell[data-value="16384"] {
            background: #b81f0c;
            color: #ffffff;
        }

        .cell[data-value="32768"] {
            background: #9e0e1e;
            color: #ffffff;
        }

        .cell[data-value="65536"] {
            background: #7a0b2e;
            color: #ffffff;
        }

        .cell[data-value="131072"] {
            background: #5c0b3a;
            color: #ffffff;
        }

        .cell[data-value="262144"] {
            background: #3d0b42;
            color: #ffffff;
        }

        .cell[data-value="524288"] {
            background: #2b0b45;
            color: #ffffff;
        }

        .cell[data-value="1048576"] {
            background: #1a0b3a;
            color: #ffffff;
        }

        /* 更高数值使用一个通用样式 */
        .cell[data-value="2097152"], .cell[data-value="4194304"], .cell[data-value="8388608"],
        .cell[data-value="16777216"], .cell[data-value="33554432"], .cell[data-value="67108864"],
        .cell[data-value="134217728"] {
            background: #0f0625;
            color: #ffd966;
        }

        /* 空方块样式（数值0） */
        .cell[data-value="0"] {
            background: #202534;
            box-shadow: inset 0 0 0 1px #313849, 0 2px 4px rgba(0, 0, 0, 0.5);
            color: transparent;
        }

        .button-bar {
            display: flex;
            justify-content: center;
            margin-top: 1.5rem;
            gap: 1.5rem;
        }

        .btn {
            background: #363d52;
            border-radius: 10px;
            padding: 0.5rem 2rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: #f2e8d5;
            cursor: pointer;
            letter-spacing: 1px;
            border: 1px solid #5f6a8a;
        }

        .btn:active {
            background: #162a30;
        }

        .btn:hover {
            background: #46506e;
            color: #fff7e6;
        }

        .hint {
            color: #9ba0b8;
            text-align: center;
            margin-top: 1rem;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
<div class="game-container">
    <div class="header">
        <div class="title">2048</div>
        <div class="score-box">
            <div class="score-label">分数</div>
            <div class="score-value" id="scoreDisplay">0</div>
        </div>
    </div>

    <div class="grid-wrapper">
        <div class="grid" id="grid"></div>
    </div>

    <div class="button-bar">
        <button class="btn" id="newGameBtn">新游戏</button>
    </div>
    <div class="hint">方向键/鼠标移动</div>
</div>

<script>
    (function () {
        // --- 游戏配置 ---
        const SIZE = 16;            // 16x16 大棋盘
        const START_TILES = 2;      // 开局生成2个方块
        const TARGET = 2048;        // 胜利目标（但可以继续玩）

        // --- 全局状态 ---
        let board = [];             // 二维数组 16x16，0表示空格
        let score = 0;
        let gameOver = false;
        let winFlag = false;       // 是否已达成2048（避免反复提示）
        let continueAfterWin = false; // 若已获胜且继续玩，则不再提示

        // DOM 元素
        const gridEl = document.getElementById('grid');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const newGameBtn = document.getElementById('newGameBtn');

        // 用于存放所有单元格div的二维数组（与board同步）
        let cellElements = [];

        // --- 初始化网格DOM结构 ---
        function createGridCells() {
            gridEl.innerHTML = '';
            cellElements = [];
            for (let r = 0; r < SIZE; r++) {
                const rowEls = [];
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.value = '0';
                    // 用于鼠标点击检测行/列（但每个格子单独处理会麻烦，后面用网格整体监听）
                    gridEl.appendChild(cell);
                    rowEls.push(cell);
                }
                cellElements.push(rowEls);
            }
        }

        // --- 更新UI（根据board刷新所有单元格显示） ---
        function updateUI() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const val = board[r][c];
                    const cell = cellElements[r][c];
                    cell.dataset.value = val;
                    // 显示数字：大于0才显示
                    cell.textContent = val === 0 ? '' : val;
                }
            }
            scoreDisplay.textContent = score;
        }

        // --- 重置/新游戏 ---
        function resetGame() {
            // 清空棋盘
            board = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
            score = 0;
            gameOver = false;
            winFlag = false;
            continueAfterWin = false;

            // 生成初始方块
            for (let i = 0; i < START_TILES; i++) {
                addRandomTile();
            }
            updateUI();
        }

        // --- 在随机空位生成一个方块 (90%概率2, 10%概率4) ---
        function addRandomTile() {
            const emptyCells = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === 0) emptyCells.push({r, c});
                }
            }
            if (emptyCells.length === 0) return false; // 没有空位

            const {r, c} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            board[r][c] = Math.random() < 0.9 ? 2 : 4;
            return true;
        }

        // --- 检查是否还有空位 ---
        function hasEmptyCell() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === 0) return true;
                }
            }
            return false;
        }

        // --- 检查是否game over (无空位且没有相邻相同数字) ---
        function checkGameOver() {
            if (hasEmptyCell()) return false;
            // 水平相邻
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE - 1; c++) {
                    if (board[r][c] !== 0 && board[r][c] === board[r][c + 1]) return false;
                }
            }
            // 垂直相邻
            for (let c = 0; c < SIZE; c++) {
                for (let r = 0; r < SIZE - 1; r++) {
                    if (board[r][c] !== 0 && board[r][c] === board[r + 1][c]) return false;
                }
            }
            return true; // 无任何可移动/合并 → game over
        }

        // --- 检查是否胜利 (出现2048) ---
        function checkWin() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] >= TARGET) return true;
                }
            }
            return false;
        }

        // --- 向某个方向移动 (dir: 'up', 'down', 'left', 'right') ---
        // 返回值：是否发生了移动或合并
        function move(dir) {
            if (gameOver) return false;

            let moved = false;
            // 根据方向选择遍历顺序
            if (dir === 'left') {
                for (let r = 0; r < SIZE; r++) {
                    const row = board[r];
                    const newRow = slideAndMerge(row);
                    if (!arraysEqual(row, newRow)) {
                        board[r] = newRow;
                        moved = true;
                    }
                }
            } else if (dir === 'right') {
                for (let r = 0; r < SIZE; r++) {
                    const row = board[r].slice().reverse();
                    const newRowRev = slideAndMerge(row);
                    const newRow = newRowRev.reverse();
                    if (!arraysEqual(board[r], newRow)) {
                        board[r] = newRow;
                        moved = true;
                    }
                }
            } else if (dir === 'up') {
                for (let c = 0; c < SIZE; c++) {
                    // 提取列
                    const col = [];
                    for (let r = 0; r < SIZE; r++) col.push(board[r][c]);
                    const newCol = slideAndMerge(col);
                    if (!arraysEqual(col, newCol)) {
                        for (let r = 0; r < SIZE; r++) board[r][c] = newCol[r];
                        moved = true;
                    }
                }
            } else if (dir === 'down') {
                for (let c = 0; c < SIZE; c++) {
                    const col = [];
                    for (let r = 0; r < SIZE; r++) col.push(board[r][c]);
                    const reversedCol = col.slice().reverse();
                    const newColRev = slideAndMerge(reversedCol);
                    const newCol = newColRev.reverse();
                    if (!arraysEqual(col, newCol)) {
                        for (let r = 0; r < SIZE; r++) board[r][c] = newCol[r];
                        moved = true;
                    }
                }
            } else {
                return false;
            }

            if (moved) {
                // 移动后添加新方块
                addRandomTile();
                updateUI();

                // 检查胜利/失败
                if (!winFlag && checkWin()) {
                    winFlag = true;
                    if (!continueAfterWin) {
                        // 使用setTimeout避免阻塞UI更新
                        setTimeout(() => {
                            if (confirm('🎉 恭喜你合成了2048！继续游戏吗？')) {
                                continueAfterWin = true;
                            } else {
                                // 玩家选择不继续，可以重置或者保持原样，这里保持原样但不再提示
                                // 但为了游戏体验，我们还是设置continueAfterWin = true 避免反复弹窗
                                continueAfterWin = true;
                            }
                        }, 50);
                    }
                }

                // 检查游戏结束
                if (checkGameOver()) {
                    gameOver = true;
                    setTimeout(() => {
                        alert('😵 游戏结束！没有可移动的方块了。点击“新游戏”重新开始。');
                    }, 100);
                }
                return true;
            }
            return false;
        }

        // --- 辅助函数：判断两个数组是否相等 ---
        function arraysEqual(a, b) {
            for (let i = 0; i < a.length; i++) {
                if (a[i] !== b[i]) return false;
            }
            return true;
        }

        // --- 核心：滑动并合并 (针对一维数组, 方向为向左压缩) ---
        // 返回新数组，长度相同
        function slideAndMerge(arr) {
            // 1. 移除所有0
            let nonZero = arr.filter(v => v !== 0);
            // 2. 合并相邻相同
            const merged = [];
            for (let i = 0; i < nonZero.length; i++) {
                if (i + 1 < nonZero.length && nonZero[i] === nonZero[i + 1]) {
                    const newVal = nonZero[i] * 2;
                    merged.push(newVal);
                    score += newVal;   // 合并得分
                    i++; // 跳过下一个
                } else {
                    merged.push(nonZero[i]);
                }
            }
            // 3. 补0到原长度
            while (merged.length < SIZE) {
                merged.push(0);
            }
            return merged;
        }

        // --- 键盘事件 ---
        function handleKeydown(e) {
            // 防止页面滚动
            const arrows = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
            if (arrows.includes(e.key)) {
                e.preventDefault();
            }
            if (gameOver) return;

            switch (e.key) {
                case 'ArrowUp':
                    move('up');
                    break;
                case 'ArrowDown':
                    move('down');
                    break;
                case 'ArrowLeft':
                    move('left');
                    break;
                case 'ArrowRight':
                    move('right');
                    break;
                default:
                    return;
            }
        }

        // --- 鼠标操作：点击格子决定滑动方向 ---
        // 策略：点击网格中的某个格子，计算点击位置相对于网格中心的方向，然后滑动
        function handleGridClick(e) {
            if (gameOver) return;

            // 获取网格容器的位置和尺寸
            const gridRect = gridEl.getBoundingClientRect();
            const centerX = gridRect.left + gridRect.width / 2;
            const centerY = gridRect.top + gridRect.height / 2;

            // 点击坐标
            const clickX = e.clientX;
            const clickY = e.clientY;

            // 计算相对于中心的偏移
            const dx = clickX - centerX;
            const dy = clickY - centerY;

            // 如果点击太靠近中心（避免误触），阈值：网格宽度的5%
            const threshold = gridRect.width * 0.05;
            if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;

            // 判断主要方向
            if (Math.abs(dx) > Math.abs(dy)) {
                // 水平方向
                if (dx > 0) move('right');
                else move('left');
            } else {
                // 垂直方向
                if (dy > 0) move('down');
                else move('up');
            }
        }

        // --- 初始化事件监听 ---
        function initEvents() {
            window.removeEventListener('keydown', handleKeydown);
            window.addEventListener('keydown', handleKeydown);

            // 移除旧的监听避免重复（但用新元素替换更可靠，这里新游戏重新绑定）
            // 由于gridEl内容会被重置，直接给gridEl绑定事件
            gridEl.removeEventListener('click', handleGridClick);
            gridEl.addEventListener('click', handleGridClick);

            // 新游戏按钮
            newGameBtn.removeEventListener('click', newGameHandler);
            newGameBtn.addEventListener('click', newGameHandler);
        }

        // 新游戏处理函数（方便移除）
        function newGameHandler() {
            resetGame();
        }

        // --- 启动游戏 ---
        function init() {
            createGridCells();
            resetGame();  // 初始化board并生成初始方块
            initEvents();
        }

        // 页面加载后启动
        window.addEventListener('DOMContentLoaded', init);
    })();
</script>
</body>
</html>
